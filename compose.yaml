services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./.runtime:/app/.runtime
    command: ["ozon-ord-sync", "api", "--api-host", "0.0.0.0", "--api-port", "8765"]

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    depends_on:
      - api
