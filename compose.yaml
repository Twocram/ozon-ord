services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./.runtime:/app/.runtime
    command: ["ozon-ord-sync", "api", "--api-host", "0.0.0.0", "--api-port", "8765"]

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    depends_on:
      - api

  browser:
    image: lscr.io/linuxserver/chromium:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./.runtime/browser-config:/config
    shm_size: "1gb"
